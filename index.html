<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PATOWARI'S HACK - Royal Wing VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02050c;
            color: #ffffff;
        }

        #game-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        .text-3d {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            text-shadow:
                0 1px 0 #091326,
                0 2px 0 #050a14,
                0 3px 6px rgba(0, 0, 0, 0.95),
                0 0 10px rgba(250, 204, 21, 0.4);
        }

        /* হ্যাক উইন্ডো ও আইকনের সারাক্ষণ উড়তে থাকা মুভমেন্ট */
        @keyframes wingWindowFly {
            0%, 100% {
                margin-top: 0px;
                margin-left: 0px;
            }
            25% {
                margin-top: -7px;
                margin-left: 3px;
            }
            50% {
                margin-top: -2px;
                margin-left: -3px;
            }
            75% {
                margin-top: -8px;
                margin-left: 2px;
            }
        }

        /* বড় 3D পাখির ডানা (Left & Right) */
        .wing-pair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: -1;
        }

        .wing-3d {
            position: absolute;
            top: 50%;
            filter:
                drop-shadow(0 6px 12px rgba(0, 0, 0, 0.95))
                drop-shadow(0 0 14px rgba(250, 204, 21, 0.55));
        }

        .wing-left {
            right: 100%;
            margin-right: -3px;
            transform-origin: 94% 52%;
            animation: birdWingBeatLeft 1.1s ease-in-out infinite;
        }

        .wing-right {
            left: 100%;
            margin-left: -3px;
            transform-origin: 6% 52%;
            animation: birdWingBeatRight 1.1s ease-in-out infinite;
        }

        @keyframes birdWingBeatLeft {
            0%, 100% { transform: translateY(-52%) rotate(-10deg) scale(1); }
            40%      { transform: translateY(-60%) rotate(26deg) scale(1.06, 0.94); }
            75%      { transform: translateY(-45%) rotate(-24deg) scale(0.96, 1.05); }
        }

        @keyframes birdWingBeatRight {
            0%, 100% { transform: translateY(-52%) rotate(10deg) scale(1); }
            40%      { transform: translateY(-60%) rotate(-26deg) scale(1.06, 0.94); }
            75%      { transform: translateY(-45%) rotate(24deg) scale(0.96, 1.05); }
        }

        /* ফ্লোটিং আইকন + ডানা */
        #floating-icon-btn {
            position: fixed;
            top: 86px;
            right: 46px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2.5px solid #facc15;
            box-shadow:
                0 0 0 2px #f43f5e,
                0 10px 24px rgba(0, 0, 0, 0.95),
                0 0 22px rgba(250, 204, 21, 0.8),
                inset 0 2px 6px rgba(255, 255, 255, 0.45);
            cursor: grab;
            z-index: 9999;
            overflow: visible;
            touch-action: none;
            background: radial-gradient(circle at 30% 25%, #065f46, #042f2e 70%, #020617 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: wingWindowFly 1.9s ease-in-out infinite;
        }

        #floating-icon-btn:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .icon-circle-clip {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #floating-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* পাসওয়ার্ড পপআপ */
        #auth-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 236px;
            background: linear-gradient(155deg, rgba(6, 78, 59, 0.98) 0%, rgba(15, 23, 42, 0.99) 55%, rgba(3, 7, 16, 1) 100%);
            border: 1.5px solid rgba(250, 204, 21, 0.9);
            border-radius: 18px;
            box-shadow:
                0 22px 44px rgba(0, 0, 0, 0.95),
                0 0 26px rgba(16, 185, 129, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);
            padding: 13px;
            display: none;
            z-index: 10000;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .auth-title {
            font-size: 12px;
            color: #fffbeb;
            text-shadow:
                0 0 8px rgba(250, 204, 21, 0.95),
                0 2px 4px rgba(0, 0, 0, 1);
            margin-bottom: 8px;
            letter-spacing: 0.7px;
        }

        .auth-input {
            width: 100%;
            padding: 7px 9px;
            background: rgba(3, 8, 18, 0.94);
            border: 1px solid rgba(52, 211, 153, 0.78);
            border-radius: 8px;
            color: #ffffff;
            font-size: 11px;
            text-align: center;
            margin-bottom: 8px;
            outline: none;
            font-weight: 700;
            user-select: text;
            -webkit-user-select: text;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 9px;
            color: #cbd5e1;
            margin-bottom: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-btn {
            width: 100%;
            padding: 7px;
            background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #eab308 100%);
            border: none;
            border-radius: 8px;
            color: #050912;
            font-size: 10.5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            box-shadow: 0 4px 14px rgba(250, 204, 21, 0.45);
        }

        #error-msg {
            color: #fb7185;
            font-size: 9px;
            margin-top: 6px;
            display: none;
            font-weight: 700;
        }

        /* হ্যাক পপআপ + সারাক্ষণ উড়তে থাকা ডানা ও মুভমেন্ট */
        .overlay-box {
            position: fixed;
            top: 96px;
            left: 56px;
            width: 226px;
            max-width: calc(100vw - 112px);
            display: none;
            z-index: 9999;
            background:
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.34) 0%, transparent 58%),
                radial-gradient(circle at 100% 100%, rgba(245, 158, 11, 0.22) 0%, transparent 55%),
                linear-gradient(165deg, #0b2524 0%, #09111e 50%, #04070e 100%);
            border-radius: 20px;
            padding: 7px;
            box-shadow:
                0 22px 44px rgba(0, 0, 0, 0.96),
                0 0 22px rgba(16, 185, 129, 0.38),
                0 0 12px rgba(250, 204, 21, 0.25),
                inset 0 1px 1.5px rgba(255, 255, 255, 0.32);
            border: 1.5px solid rgba(250, 204, 21, 0.78);
            backdrop-filter: blur(12px);
            animation: wingWindowFly 1.9s ease-in-out infinite;
        }

        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            margin-bottom: 4.5px;
            cursor: grab;
            touch-action: none;
            padding: 2px 3px 4px;
            border-bottom: 1px solid rgba(250, 204, 21, 0.35);
        }

        .popup-header:active {
            cursor: grabbing;
        }

        .badge-left {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fef08a 100%);
            color: #1c1917;
            font-size: 6.2px;
            padding: 2px 4.5px;
            border-radius: 6px;
            line-height: 1.05;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: none;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .brand-center {
            text-align: center;
            flex: 1;
            pointer-events: none;
        }

        /* পাটোয়ারী নামটা যেন একদম স্পষ্টভাবে চোখে ফুটে ওঠে */
        .brand-main {
            font-style: italic;
            font-size: 10.6px;
            letter-spacing: 0.55px;
            color: #fffbeb;
            -webkit-text-fill-color: #fffbeb;
            -webkit-text-stroke: 0.45px #78350f;
            text-shadow:
                0 0 6px rgba(254, 240, 138, 0.95),
                0 0 14px rgba(250, 204, 21, 0.85),
                0 1px 0 #78350f,
                0 2px 4px rgba(0, 0, 0, 1);
            line-height: 1.12;
            animation: patowariPopGlow 1.8s ease-in-out infinite alternate;
        }

        @keyframes patowariPopGlow {
            0% {
                color: #fffbeb;
                -webkit-text-fill-color: #fffbeb;
                text-shadow:
                    0 0 6px rgba(254, 240, 138, 0.9),
                    0 0 13px rgba(250, 204, 21, 0.75),
                    0 2px 4px rgba(0, 0, 0, 1);
            }
            100% {
                color: #fde047;
                -webkit-text-fill-color: #fde047;
                text-shadow:
                    0 0 8px rgba(250, 204, 21, 1),
                    0 0 18px rgba(52, 211, 153, 0.8),
                    0 2px 5px rgba(0, 0, 0, 1);
            }
        }

        .brand-sub {
            font-size: 6px;
            color: #a7f3d0;
            letter-spacing: 0.3px;
            margin-top: 1px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 2.5px;
        }

        .voice-toggle-btn {
            font-size: 6px;
            padding: 2px 4.5px;
            border-radius: 5px;
            border: 1px solid rgba(251, 113, 133, 0.85);
            background: linear-gradient(135deg, #f43f5e, #be123c);
            color: #ffffff;
            cursor: pointer;
            text-shadow: none;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.5);
        }

        .voice-toggle-btn.is-off {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #94a3b8;
            border-color: rgba(148, 163, 184, 0.45);
            box-shadow: none;
        }

        .hide-btn {
            background: linear-gradient(180deg, #134e4a, #042f2e);
            color: #ecfdf5;
            border: 1px solid rgba(52, 211, 153, 0.55);
            padding: 2px 4.5px;
            border-radius: 5px;
            font-size: 6px;
            cursor: pointer;
        }

        .market-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5px;
            margin-bottom: 5px;
            background: rgba(2, 6, 14, 0.95);
            padding: 2px;
            border-radius: 9px;
            border: 1px solid rgba(52, 211, 153, 0.35);
        }

        .market-btn {
            font-size: 6.8px;
            padding: 2.5px 1px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: rgba(15, 23, 42, 0.88);
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
        }

        .market-btn.active {
            background: linear-gradient(135deg, #10b981 0%, #f59e0b 100%);
            color: #050912;
            border-color: #fef08a;
            text-shadow: none;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.55);
        }

        .ai-call-banner {
            margin-bottom: 5px;
            padding: 3px 5px;
            border-radius: 8px;
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.22), rgba(245, 158, 11, 0.22));
            border: 1px solid rgba(250, 204, 21, 0.45);
            font-size: 7px;
            font-weight: 800;
            color: #fef08a;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pred-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.32fr 0.9fr;
            gap: 4px;
            align-items: stretch;
            position: relative;
        }

        .side-panel {
            border-radius: 12px;
            padding: 5px 3px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.22);
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .panel-small {
            background: linear-gradient(170deg, rgba(20, 184, 166, 0.48) 0%, rgba(17, 94, 89, 0.92) 60%, rgba(4, 47, 46, 0.98) 100%);
        }

        .panel-big {
            background: linear-gradient(170deg, rgba(245, 158, 11, 0.48) 0%, rgba(146, 64, 14, 0.92) 60%, rgba(69, 26, 3, 0.98) 100%);
        }

        .side-panel.is-predicted {
            border-color: #fef08a;
            transform: translateY(-1px) scale(1.02);
            box-shadow:
                0 0 16px rgba(250, 204, 21, 0.62),
                0 8px 16px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.45);
        }

        .side-panel > div {
            position: relative;
            z-index: 2;
        }

        .firecracker-rocket {
            position: absolute;
            left: 50%;
            bottom: 3px;
            width: 3px;
            height: 11px;
            border-radius: 999px;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #ffffff 0%, #34d399 50%, #fbbf24 100%);
            box-shadow: 0 0 8px #34d399, 0 0 15px #fbbf24;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: rocketAscendBlast 2.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }

        .panel-big .firecracker-rocket {
            animation-delay: 1.05s;
        }

        @keyframes rocketAscendBlast {
            0%   { opacity: 0; bottom: 2px; height: 9px; transform: translateX(-50%) scale(0.9); }
            12%  { opacity: 1; bottom: 8px; height: 12px; transform: translateX(-50%) scale(1); }
            62%  { opacity: 1; bottom: calc(100% - 17px); height: 7px; transform: translateX(-50%) scale(1.05); }
            67%  { opacity: 0; bottom: calc(100% - 14px); height: 2px; transform: translateX(-50%) scale(0.4); }
            100% { opacity: 0; bottom: 2px; height: 9px; transform: translateX(-50%) scale(0.9); }
        }

        .firecracker-burst {
            position: absolute;
            left: 50%;
            top: 13px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.15);
            background: radial-gradient(circle, #ffffff 0%, #34d399 38%, #fbbf24 70%, transparent 100%);
            box-shadow:
                0 0 14px #ffffff,
                0 0 24px #34d399,
                -11px -9px 6px #facc15,
                11px -9px 6px #34d399,
                -13px 2px 6px #fb7185,
                13px 2px 6px #4ade80,
                -8px 10px 6px #38bdf8,
                8px 10px 6px #facc15,
                0 -13px 6px #ffffff,
                0 12px 6px #fb7185;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            animation: thashLightScatter 2.1s ease-out infinite;
        }

        .panel-big .firecracker-burst {
            animation-delay: 1.05s;
        }

        @keyframes thashLightScatter {
            0%, 64% { opacity: 0; transform: translate(-50%, -50%) scale(0.15); }
            68%       { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
            82%       { opacity: 0.9; transform: translate(-50%, -50%) scale(1.85); }
            100%      { opacity: 0; transform: translate(-50%, -50%) scale(2.35); }
        }

        .firecracker-sparks {
            position: absolute;
            left: 50%;
            top: 13px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            box-shadow:
                -16px -4px 4px #facc15,
                16px -4px 4px #34d399,
                -6px -14px 4px #fb7185,
                6px -14px 4px #4ade80,
                -12px 7px 4px #38bdf8,
                12px 7px 4px #facc15,
                -4px 14px 4px #fb7185,
                4px 14px 4px #4ade80;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            animation: sparkOuterSpray 2.1s ease-out infinite;
        }

        .panel-big .firecracker-sparks {
            animation-delay: 1.05s;
        }

        @keyframes sparkOuterSpray {
            0%, 65% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
            71%       { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            88%       { opacity: 0.65; transform: translate(-50%, -50%) scale(1.75); }
            100%      { opacity: 0; transform: translate(-50%, -50%) scale(2.15); }
        }

        .panel-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
            transform: perspective(180px) rotateX(10deg);
            color: #ffffff;
            text-shadow:
                0 1px 0 #06131a,
                0 2px 4px rgba(0, 0, 0, 0.95),
                0 0 8px rgba(250, 204, 21, 0.6);
        }

        .panel-range {
            font-size: 6.8px;
            color: #e2e8f0;
            opacity: 0.92;
            margin-top: 1.5px;
        }

        .panel-tag {
            margin-top: 4px;
            font-size: 5.8px;
            padding: 2px 2px;
            border-radius: 4.5px;
            background: rgba(15, 23, 42, 0.92);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .panel-tag.active-tag {
            background: linear-gradient(135deg, #fde047 0%, #22c55e 100%);
            color: #052e16;
            border-color: #ffffff;
            text-shadow: none;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.65);
        }

        .center-panel {
            background:
                radial-gradient(circle at 50% 42%, rgba(52, 211, 153, 0.14) 0%, transparent 68%),
                linear-gradient(180deg, rgba(9, 32, 38, 0.98) 0%, rgba(4, 9, 18, 0.99) 100%);
            border: 1px solid rgba(52, 211, 153, 0.65);
            border-radius: 12px;
            padding: 4px 3.5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .period-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2.5px;
            background: rgba(15, 23, 42, 0.94);
            padding: 1.5px 4px;
            border-radius: 4.5px;
            width: 100%;
            border: 1px solid rgba(52, 211, 153, 0.25);
        }

        .period-display {
            font-size: 6px;
            color: #f8fafc;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-dot {
            width: 4.5px;
            height: 4.5px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 6px #34d399, 0 0 10px #4ade80;
            flex-shrink: 0;
            animation: liveBlink 1.2s ease-in-out infinite;
        }

        @keyframes liveBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.82); }
        }

        .football-orb-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5px 0;
        }

        .red-white-rack-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-conic-gradient(
                from 0deg,
                #ef4444 0deg 22.5deg,
                #ffffff 22.5deg 45deg
            );
            box-shadow:
                0 0 12px rgba(239, 68, 68, 0.7),
                0 0 16px rgba(255, 255, 255, 0.35),
                0 6px 12px rgba(0, 0, 0, 0.85);
            animation: rackSpinSlow 5s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 3.8px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4.5px), #000 calc(100% - 3.8px));
        }

        @keyframes rackSpinSlow {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glow-orb {
            position: relative;
            font-family: 'Chakra Petch', sans-serif;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14.5px;
            font-weight: 700;
            color: #ffffff;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 1),
                0 2px 0 #090d16,
                0 0 8px rgba(0, 0, 0, 0.95);
            border: 1.5px solid #ffffff;
            overflow: hidden;
            z-index: 2;
        }

        .glow-orb::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background:
                repeating-conic-gradient(
                    from 15deg,
                    rgba(255, 255, 255, 0.25) 0deg 14deg,
                    transparent 14deg 60deg
                ),
                radial-gradient(circle at 50% 50%, transparent 32%, rgba(255, 255, 255, 0.36) 33.5%, transparent 35.5%),
                radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.45), transparent 55%);
            pointer-events: none;
            z-index: 1;
        }

        .glow-orb span {
            position: relative;
            z-index: 2;
        }

        .orb-green {

                colorBn = "ভায়োলেট ও রেড";
            } else if (cachedPrediction.colorName.includes("GRN") && cachedPrediction.colorName.includes("VIOLET")) {
                colorBn = "ভায়োলেট ও গ্রিন";
            } else if (cachedPrediction.colorName.includes("RED")) {
                colorBn = "রেড";
            }

            if (/কেমন আছ|কি খবর|হ্যালো|হাই|সালাম/.test(lower)) {
                return `আমি একদম ভালো আছি! ${tradeCall} নম্বর ${numBn}, কালার ${colorBn}।`;
            }
            if (/সিগন্যাল|কোনটা|ধরব|ধরবো|প্রেডিকশন|নম্বর|কালার|বিগ|স্মল|ট্রেড|কি বলছে|কী বলছে/.test(lower)) {
                return `${tradeCall} নম্বর ${numBn}, কালার ${colorBn}। কনফিডেন্স ${cachedPrediction.confidence} পার্সেন্ট।`;
            }
            if (/উইন|লস|রেজাল্ট|হিসাব|স্কোর/.test(lower)) {
                return `এখন পর্যন্ত ${winCount} বার উইন এবং ${lossCount} বার লস হয়েছে।`;
            }
            if (/টিপস|বাজেট|কিভাবে|কত/.test(lower)) {
                return "ধৈর্য ধরে ছোট অ্যামাউন্ট দিয়ে ট্রেড করো, একসাথে সব ব্যালেন্স না লাগিয়ে নিয়ম মেনে চলো।";
            }
            return `${tradeCall} এখন নম্বর ${numBn} (${colorBn}) পজিশনে আছে।`;
        }

        function startVoiceListening() {
            const micBtn = document.getElementById("mic-speak-btn");
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRec) {
                const fallbackReply = buildReplyFromSpokenText("সিগন্যাল");
                setReplyAndSpeak(fallbackReply);
                return;
            }

            if (activeRecognizer) {
                try { activeRecognizer.stop(); } catch (_) {}
                activeRecognizer = null;
            }

            const rec = new SpeechRec();
            activeRecognizer = rec;
            rec.lang = "bn-BD";
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            micBtn.classList.add("listening");
            micBtn.textContent = "🎧 শুনছি... কথা বলো";
            document.getElementById("ai-reply-text").textContent = "🎧 তোমার কথা শুনছি...";

            rec.onresult = (event) => {
                const transcript = event.results?.[0]?.[0]?.transcript || "";
                const reply = buildReplyFromSpokenText(transcript);
                setReplyAndSpeak(reply);
            };

            rec.onerror = () => {
                const reply = buildReplyFromSpokenText("সিগন্যাল");
                setReplyAndSpeak(reply);
            };

            rec.onend = () => {
                micBtn.classList.remove("listening");
                micBtn.textContent = "🎤 চাপ দিয়ে কথা বলো";
                activeRecognizer = null;
            };

            try {
                rec.start();
            } catch (_) {
                micBtn.classList.remove("listening");
                micBtn.textContent = "🎤 চাপ দিয়ে কথা বলো";
                const reply = buildReplyFromSpokenText("সিগন্যাল");
                setReplyAndSpeak(reply);
            }
        }

        function announcePredictionBangla(pred) {
            const callText = getTradeCallSentence(pred);
            document.getElementById("ai-call-banner").textContent = `👩 ${callText}`;
            if (!voiceEnabled) return;
            const numBn = BANGLA_DIGITS[pred.num] ?? pred.num;
            speakFemaleBangla(`${callText} নম্বর ${numBn}।`);
        }

        function handleIconClick() {
            if (isUnlocked) {
                document.getElementById('main-content').style.display = 'block';

            if (pass === "PATOWARI69") {

        function startPeriodGenerator() {
            updateSignalLogic();
            if (!signalTimerStarted) {
                signalTimerStarted = true;
                setInterval(updateSignalLogic, 1000);
            }
        }

        function copyPeriodNumber() {
            const periodText = document.getElementById('period-num').innerText.trim();
            if (periodText && periodText !== "Loading...") {
                navigator.clipboard.writeText(periodText).then(() => {
                    const toast = document.getElementById('copy-toast');
                    toast.style.display = 'block';
                    setTimeout(() => {
                        toast.style.display = 'none';
                    }, 1200);
                    if (voiceEnabled) {
                        speakFemaleBangla("পিরিয়ড নম্বর কপি হয়েছে।");
                    }
                }).catch(() => {});
            }
        }

        function getSyncedMarketClock(marketKey, cfg, now) {
            const secInDay = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
            const slot = Math.floor(secInDay / cfg.duration);
            const rem = secInDay % cfg.duration;
            const timeLeft = cfg.duration - rem;
            const elapsed = rem;
            const periodIndexToday = slot + 1;
            return { elapsed, timeLeft, periodIndexToday };
        }

        function mixHash(seed) {
            let x = seed >>> 0;
            x ^= x >>> 16;
            x = Math.imul(x, 0x7feb352d) >>> 0;
            x ^= x >>> 15;
            x = Math.imul(x, 0x846ca68b) >>> 0;
            x ^= x >>> 16;
            return x >>> 0;
        }

        function getColorMeta(num) {
            if (num === 0) {
                return { orbClass: "orb-violet", wheelClass: "w-violet-red", colorName: "VIOLET+RED" };
            }
            if (num === 5) {
                return { orbClass: "orb-violet", wheelClass: "w-violet-green", colorName: "VIOLET+GRN" };
            }
            if ([1, 3, 7, 9].includes(num)) {
                return { orbClass: "orb-green", wheelClass: "w-green", colorName: "GREEN" };
            }
            return { orbClass: "orb-red", wheelClass: "w-red", colorName: "RED" };
        }

        function evaluateSlot(slotNum, cfg, dateSeed) {
            const baseSeed = (dateSeed ^ Math.imul(slotNum, cfg.salt)) >>> 0;
            const h1 = mixHash(baseSeed);
            const h2 = mixHash(h1 ^ (slotNum * 2654435761));

            let prevStreakType = null;
            let streakCount = 0;
            let bigCount = 0;

            for (let lookback = 1; lookback <= 5; lookback++) {
                const prevIdx = Math.max(1, slotNum - lookback);
                const pHash = mixHash((dateSeed ^ Math.imul(prevIdx, cfg.salt)) >>> 0);
                const pIsBig = (pHash % 100) >= 49;
                if (pIsBig) bigCount++;

                if (lookback === 1) {
                    prevStreakType = pIsBig ? "BIG" : "SMALL";
                    streakCount = 1;
                } else if (((pIsBig ? "BIG" : "SMALL") === prevStreakType) && streakCount === lookback - 1) {
                    streakCount++;
                }
            }

            let bigScore = h1 % 100;

            if (prevStreakType === "BIG" && streakCount >= 3) {
                bigScore -= 18;
            } else if (prevStreakType === "SMALL" && streakCount >= 3) {
                bigScore += 18;
            }

            if (bigCount >= 4) bigScore -= 10;
            if (bigCount <= 1) bigScore += 10;

            const type = bigScore >= 50 ? "BIG" : "SMALL";

            const poolSmall = [0, 1, 2, 3, 4];
            const poolBig = [5, 6, 7, 8, 9];
            const pool = type === "BIG" ? poolBig : poolSmall;

            let pickIdx = h2 % pool.length;
            let num = pool[pickIdx];

            if (slotNum > 1) {
                const prevNum = evaluateSlotRawNum(slotNum - 1, cfg, dateSeed);
                if (num === prevNum) {
                    num = pool[(pickIdx + 1) % pool.length];
                }
            }

            const delta = Math.abs(bigScore - 50);
            const confidence = Math.min(94, Math.max(76, 78 + Math.floor(delta * 0.65) + (h2 % 6)));
            const meta = getColorMeta(num);

            return { type, num, confidence, ...meta };
        }

        function evaluateSlotRawNum(slotNum, cfg, dateSeed) {
            const baseSeed = (dateSeed ^ Math.imul(slotNum, cfg.salt)) >>> 0;
            const h1 = mixHash(baseSeed);
            const h2 = mixHash(h1 ^ (slotNum * 2654435761));
            const type = (h1 % 100) >= 50 ? "BIG" : "SMALL";
            const pool = type === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
            return pool[h2 % pool.length];
        }

        function renderRecentWheels(cfg, periodIndexToday, dateSeed) {
            const container = document.getElementById('recent-wheels');
            container.innerHTML = "";
            for (let i = 9; i >= 0; i--) {
                const idx = Math.max(1, periodIndexToday - i);
                const sig = evaluateSlot(idx, cfg, dateSeed);

                const el = document.createElement('div');
                el.className = `color-wheel ${sig.wheelClass}`;
                el.innerHTML = `<span>${sig.num}</span>`;
                container.appendChild(el);
            }
        }

        function updateSignalLogic() {
            if (!isUnlocked) return;

            const cfg = MARKETS[currentMarket] || MARKETS["30S"];
            const now = new Date();
            const { elapsed, timeLeft, periodIndexToday } = getSyncedMarketClock(currentMarket, cfg, now);

            const dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
            const dateSeed = parseInt(dateStr, 10) || 20261121;
            const formattedIndex = String(cfg.offset + periodIndexToday).padStart(5, '0');
            const fullPeriod = `${dateStr}1000${formattedIndex}`;

            document.getElementById('period-num').innerText = fullPeriod;
            document.getElementById('timer-display').innerText = `NEXT IN ${String(timeLeft).padStart(2, '0')}s`;

            if (cachedPeriod && cachedPeriod !== fullPeriod && lastSettledPeriod !== cachedPeriod) {
                lastSettledPeriod = cachedPeriod;
                const prevIndex = Math.max(1, periodIndexToday - 1);
                const actualOutcome = evaluateSlot(prevIndex, cfg, dateSeed);
                if (actualOutcome.type === cachedPrediction.type) {
                    winCount++;
                    document.getElementById("wl-status").textContent = `W: ${winCount} | L: ${lossCount}`;
                    setReplyAndSpeak("অভিনন্দন! আগের রাউন্ড উইন হয়েছে!");
                } else {
                    lossCount++;
                    document.getElementById("wl-status").textContent = `W: ${winCount} | L: ${lossCount}`;
                    setReplyAndSpeak("দুঃখিত, আগের রাউন্ড লস হয়েছে। নতুন ট্রেড কল দেখো!");
                }
            }

            if (fullPeriod !== cachedPeriod) {
                cachedPeriod = fullPeriod;
                cachedPrediction = evaluateSlot(periodIndexToday, cfg, dateSeed);
            }

            const orb = document.getElementById('main-orb');
            const orbText = document.getElementById('main-orb-text');
            const smallPanel = document.getElementById('small-panel');
            const bigPanel = document.getElementById('big-panel');
            const smallTag = document.getElementById('small-tag');
            const bigTag = document.getElementById('big-tag');
            const confLabel = document.getElementById('conf-label');

            if (elapsed <= 2) {
                orbText.innerText = "...";
                orb.className = "glow-orb orb-violet";
                document.getElementById('color-label').innerText = "SCANNING";
                confLabel.innerText = "SYNC...";
                document.getElementById("ai-call-banner").textContent = "👩 সিগন্যাল স্ক্যান হচ্ছে, একটু অপেক্ষা করো...";
                smallPanel.classList.remove('is-predicted');
                bigPanel.classList.remove('is-predicted');
                smallTag.innerText = "WAIT";
                bigTag.innerText = "WAIT";
                smallTag.className = "panel-tag text-3d";
                bigTag.className = "panel-tag text-3d";
            } else {
                orbText.innerText = String(cachedPrediction.num);
                orb.className = `glow-orb ${cachedPrediction.orbClass}`;
                document.getElementById('color-label').innerText = cachedPrediction.colorName;
                confLabel.innerText = `CONF ${cachedPrediction.confidence}%`;
                document.getElementById("ai-call-banner").textContent = `👩 ${getTradeCallSentence(cachedPrediction)}`;

                if (cachedPrediction.type === "BIG") {
                    bigPanel.classList.add('is-predicted');
                    smallPanel.classList.remove('is-predicted');
                    bigTag.innerText = "PREDICTED";
                    bigTag.className = "panel-tag text-3d active-tag";
                    smallTag.innerText = "SKIP";
                    smallTag.className = "panel-tag text-3d";
                } else {
                    smallPanel.classList.add('is-predicted');
                    bigPanel.classList.remove('is-predicted');
                    smallTag.innerText = "PREDICTED";
                    smallTag.className = "panel-tag text-3d active-tag";
                    bigTag.innerText = "SKIP";
                    bigTag.className = "panel-tag text-3d";
                }

                if (lastSpokenPeriod !== fullPeriod) {
                    lastSpokenPeriod = fullPeriod;
                    setTimeout(() => announcePredictionBangla(cachedPrediction), 1200);
                }
            }

            renderRecentWheels(cfg, periodIndexToday, dateSeed);
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                pickFemaleBanglaVoice();
            };
        }

        makeDraggable(document.getElementById("floating-icon-btn"), document.getElementById("floating-icon-btn"), handleIconClick);
        makeDraggable(document.getElementById("main-content"), document.getElementById("main-content-header"), null);

        function makeDraggable(targetEl, handleEl, onTap) {
            let isDown = false;
            let moved = false;
            let startX = 0, startY = 0, origLeft = 0, origTop = 0;

            function onStart(x, y) {
                const rect = targetEl.getBoundingClientRect();
                origLeft = rect.left;
                origTop = rect.top;
                startX = x;
                startY = y;
                isDown = true;
                moved = false;
                targetEl.style.left = `${origLeft}px`;
                targetEl.style.top = `${origTop}px`;
                targetEl.style.right = "auto";
                targetEl.style.bottom = "auto";
                targetEl.style.transform = "none";
            }

            function onMove(x, y) {
                if (!isDown) return;
                const dx = x - startX;
                const dy = y - startY;
                if (Math.hypot(dx, dy) > 6) moved = true;
                const maxLeft = Math.max(4, window.innerWidth - targetEl.offsetWidth - 4);
                const maxTop = Math.max(4, window.innerHeight - targetEl.offsetHeight - 4);
                targetEl.style.left = `${Math.max(4, Math.min(maxLeft, origLeft + dx))}px`;
                targetEl.style.top = `${Math.max(4, Math.min(maxTop, origTop + dy))}px`;
            }

            function onEnd() {
                if (!isDown) return;
                isDown = false;
                if (!moved && typeof onTap === "function") onTap();
            }

            handleEl.addEventListener("touchstart", (e) => {
                if (e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            handleEl.addEventListener("touchmove", (e) => {
                if (!isDown || e.touches.length !== 1) return;
                e.preventDefault();
                onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            handleEl.addEventListener("touchend", onEnd);
            handleEl.addEventListener("touchcancel", onEnd);

            handleEl.addEventListener("mousedown", (e) => {
                if (e.button !== 0 || e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                onStart(e.clientX, e.clientY);

                function mm(ev) { onMove(ev.clientX, ev.clientY); }
                function mu() {
                    document.removeEventListener("mousemove", mm);
                    document.removeEventListener("mouseup", mu);
                    onEnd();
                }
                document.addEventListener("mousemove", mm);
                document.addEventListener("mouseup", mu);
            });
        }
    </script>
